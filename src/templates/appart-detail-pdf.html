        font-display: swap;
      }
      @page {
        size: A4 landscape;
        margin: 12mm;
      }
      html,
      body {
        height: 100%;
      }
      body {
        font-family: 'Helios', sans-serif;
        font-weight: 400;
        line-height: 1.4;
        font-size: 18px;
        margin: 0;
      }
      * {
        box-sizing: border-box;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }

        padding-left: 8.33%;

      }
      .col-11 {

      }
      .col-12 {
        width: 100%;
      }
      .row {
        display: flex;
        justify-content: space-between;
      }

        padding: 30px;

      .pdf-info__logo {
        margin-bottom: 40px;
       }
       .pdf {
        height: auto;
       }
      .pdf__descr {
        max-width: 240px;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 30px;
        margin-bottom: 10mm;
      }
      .pdf__title {
        font-size: clamp(26px, 1.111rem + 1.27vw, 36px);
        line-height: 1.2;
        color: #26202E;
        margin-bottom: 30px;
        font-family: "Helios", sans-serif;
        font-weight: 400;
      }
      .pdf-info {
        background-color: #EAE8EC;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        gap: 40px;
      }
      .pdf__sqr {
        color: #26202E;
        font-size: 24px;
        display: block;
        margin-bottom: 30px;
        font-family: "Helios", sans-serif;
      }
      .appart-detail__value {
          font-size: 20px;
          color: #26202E;
          font-family: "Helios", sans-serif;
      }

      .appart-detail__head {
          font-size: 14px;
          color: #AEAAB7;
          font-family: "Helios", sans-serif;
      }
      .pdf__street {
        color: #928D9D;
        font-size: 12px;
        font-family: "Helios", sans-serif;
      }
      .pdf__price {
        color: #26202E;
        font-size: 34px;
        font-family: "Helios", sans-serif;
        line-height: 1;
      }
      .pdf__street-1 {
        position: absolute;
        top: 0;
        left: 50%;
        transform: translateX(-50%);
      }
      .pdf__street-3 {
        position: absolute;
        bottom: 0;
        left: 50%;
        transform: translateX(-50%);
      }
      .pdf__planSmall {
        display: flex;
        align-items: flex-end;
        justify-content: flex-end;
        max-height: 450px;
        overflow: hidden;
      }
      .pdf__planSmall svg {
        width: auto;
        height: auto;
        max-height: 360px;
        max-width: 460px;
        display: block;
      }
      .pdf__street-2 {
        position: absolute;
        bottom: 40%;
        right: 0%;
        transform: translate(0%, 0%);
        writing-mode: vertical-rl;
      }
      .pdf__priceRow {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 40px;
        align-items: flex-end;
        max-width: 400px;
      }
      .pdf__head {
        color: #928D9D;
        font-size: 10px;
        margin-bottom: 16px;
        font-family: "Helios", sans-serif;
      }
      .pdf__phone {
        font-family: "Helios", sans-serif;
        display: block;
        color: #26202E;
        margin-bottom: 10px;
        font-size: 16px;
      }
      .pdf__mail {
        font-family: "Helios", sans-serif;
        color: #928D9D;
        font-size: 12px;
        display: block;
        margin-bottom: 10px;
      }
      .pdf__adress {
        font-family: "Helios", sans-serif;
        font-size: 12px;
        color: #928D9D;
        margin: 0;
      }
      .pdf__planBig {
        width: 320px;
      }
      .pdf-images {
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        position: relative;
      }
      .pdf-compas {
        position: absolute;
        top: 30px;
        right: 30px;
      }
      .pdf__planSmallWrap {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
      }
      .pdf__planSmallTitle {
        color: #928D9D;
        font-size: 12px;
        font-family: "Helios", sans-serif;
      }
      .pdf-detail__img {
          position: relative;
          top:25%;
          left: 30%;
          transform: translate(-50%, -50%);
          width: -moz-fit-content;
          width: fit-content;
          height: -moz-fit-content;
          height: fit-content;
          margin-bottom: 40px;
      }
      .pdf__location {
        position: absolute;
        top: 50%;
        left: 80%;
        transform: translate(-50%, -50%);
        height: 460px;
        width: 500px;
        pointer-events: none;
      }
      @media print {
        .pdf {
          height: auto !important;
          break-inside: avoid-page;
          page-break-inside: avoid;
        }
        a {
          color: #26202e;
          text-decoration: none;
        }
      }

    </style>
  </head>
  <body>

    <section class="pdf col-12 row">
      <div class="col-6 pdf-info pdf-block">
        <div class="pdf-info__top">
          <svg class="pdf-info__logo" width="100" height="16" viewBox="0 0 100 16" fill="none" xmlns="http://www.w3.org/2000/svg">

          </svg>
          <h2 class="pdf__title">%%TITLE%%</h2>
          <div class="pdf__sqr">%%SQR%%</div>
          <div class="pdf__descr">
            <div>
              <div class="appart-detail__head">Этаж</div>
              <div class="appart-detail__value">%%FLOOR%%</div>
            </div>
            <div>
              <div class="appart-detail__head">Блок-секция</div>
              <div class="appart-detail__value">%%SECTION%%</div>
            </div>
          </div>
          <div class="pdf__priceRow">
            <div class="pdf__price">%%PRICE%%</div>
            <div class="pdf__per">
              <div class="appart-detail__head">За м²</div>
              <div class="appart-detail__value">%%PRICE_PER_M2%%</div>
            </div>
          </div>
        </div>
        <div class="pdf-info__bottom">
        <div class="pdf__contacts">
          <div class="pdf__head">Офис продаж</div>
            <span class="pdf__phone">%%PHONE_HTML%%</span>
            <span class="pdf__mail">%%EMAIL_HTML%%</span>
            <p class="pdf__adress">%%ADDR_HTML%%</p>
          </div>
        </div>
      </div>

        <div class="pdf-detail__img">
          <div class="pdf__planBig">
            %%APART_SVG%%
          </div>
          <div class="pdf__location">
            <span class="pdf__street-1 pdf__street">Павловский тракт</span>
            <span class="pdf__street-2 pdf__street">Ул. Малахова</span>
            <span class="pdf__street-3 pdf__street">Ул. Взлетная</span>
          </div>
        </div>

          <div class="pdf__planSmallWrap">
            <div class="pdf__planSmallTitle">Квартира на этаже</div>
            <div class="pdf__planSmall">
              %%FLOOR_SVG%%
            </div>
          </div>
      </div>

    <script>
      window.addEventListener('load', () => {
        setTimeout(() => {
          window.focus();
          window.print();
        }, 50);
      });
      window.addEventListener('afterprint', () => {
        setTimeout(() => window.close(), 50);
      });
    </script>
  </body>
